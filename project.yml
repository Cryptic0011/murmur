name: Murmur
packages:
  # 0.x packages may break APIs in minor releases, so allow patch updates only.
  # Exact versions are locked in the committed Package.resolved.
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    minorVersion: "0.18.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    minorVersion: "0.15.4"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.2"
options:
  bundleIdPrefix: com.murmur
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.4"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  Murmur:
    type: application
    platform: macOS
    sources:
      - path: Murmur
        excludes:
          - AppIcon.icns
    dependencies:
      - package: WhisperKit
      - package: FluidAudio
      - package: Sparkle
    info:
      path: Murmur/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: "Murmur records your voice while you dictate, transcribes it with the speech engine you choose (on-device by default; a cloud provider such as Groq receives the audio only if you select it), and pastes the text where you're typing."
        NSDocumentsFolderUsageDescription: "Murmur looks for speech models that earlier versions downloaded to your Documents folder and copies them to Murmur's Application Support folder."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: "https://github.com/Cryptic0011/murmur/releases/latest/download/appcast.xml"
        SUPublicEDKey: "GPa3gezkwPZ2JAkqkXxa3DDSirwWVGd7kr1/H1Uu0sY="
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: true
        SUScheduledCheckInterval: 43200 # 12 hours
        CFBundleURLTypes:
          - CFBundleURLName: com.murmur.Murmur
            CFBundleURLSchemes: [murmur]
    entitlements:
      path: Murmur/Murmur.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murmur.Murmur
  MurmurTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MurmurTests
    info:
      path: MurmurTests/Info.plist
    dependencies:
      - target: Murmur
schemes:
  Murmur:
    build:
      targets:
        Murmur: all
        MurmurTests: [test]
    test:
      targets:
        - MurmurTests
